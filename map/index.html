<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Your foundation map | Foundation Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Light theme only: the page no longer switches to dark when a computer is in dark mode */
        color-scheme: light;
        --bg: #f8f6f1;
        --on-bg: #0e2a40;
        --surface: #ffffff;
        --ink: #0b1e3c;
        --body: #1e2f48;
        --muted: #4f6178;
        --line: #e4dfd5;
        --teal: #2bb3c0;
        --teal-deep: #1b8794;
        --teal-text: #0a6670;
        --tint: #e7f6f8;
        --tint-strong: #cdeef2;
        --warn: #8a4b00;
        --warn-bg: #fff4e2;
        --warn-line: #e8b76a;
        --shadow:
          0 1px 2px rgba(11, 30, 60, 0.04), 0 8px 24px rgba(11, 30, 60, 0.06);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--body);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      .wrap {
        max-width: 1020px;
        margin: 0 auto;
        padding: 0 20px 56px;
      }
      header.top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 0 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: block;
      }
      .brand b {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand span {
        display: block;
        font-size: 13px;
        color: var(--on-bg);
        line-height: 1.2;
      }
      /* Text that sits directly on the teal background uses the deep navy for contrast */
      body .lead,
      body .stats span,
      body .fine,
      body .side small,
      body .results-grid > div > p,
      body details summary,
      body details li {
        color: var(--on-bg);
      }
      body .side small {
        color: var(--muted);
      }
      /* The compass sits on a white card so the teal star stays visible */
      .side,
      .results-grid .map {
        background: var(--surface);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow);
      }
      .xp {
        font-weight: 700;
        color: var(--teal-text);
        font-size: 14px;
        white-space: nowrap;
        background: var(--surface);
        border: 1px solid var(--tint-strong);
        border-radius: 999px;
        padding: 6px 14px;
      }
      .xp:empty {
        display: none;
      }
      /* Navy header band */
      .band {
        background: #0b1e3c;
        margin-bottom: 28px;
      }
      .wrap.band-in {
        padding-bottom: 12px;
      }
      .band .brand b {
        color: #ffffff;
      }
      .band .brand span {
        color: #a9d9df;
      }
      .band .xp {
        border-color: transparent;
      }
      .ribbon {
        font-size: 13px;
        color: #c9d6e6;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
        padding-top: 10px;
      }
      h1,
      h2,
      h3,
      .q,
      .q2,
      .itemtitle,
      .brand b,
      legend {
        color: var(--ink);
      }

      h1 {
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.08;
        letter-spacing: -0.025em;
        font-weight: 800;
        margin: 8px 0 14px;
        max-width: 16ch;
      }
      h2 {
        font-size: clamp(22px, 3.4vw, 30px);
        line-height: 1.15;
        letter-spacing: -0.02em;
        font-weight: 700;
        margin: 0 0 10px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 6px;
        font-weight: 700;
      }
      p {
        margin: 0 0 14px;
        max-width: 62ch;
      }
      .lead {
        font-size: 18px;
        color: var(--muted);
        max-width: 54ch;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px;
        box-shadow: var(--shadow);
      }
      .grid {
        display: grid;
        gap: 28px;
        grid-template-columns: 1fr;
        align-items: start;
      }
      @media (min-width: 860px) {
        .grid.quest {
          grid-template-columns: minmax(0, 1fr) 300px;
        }
        .side {
          position: sticky;
          top: 20px;
        }
      }
      .side {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .side svg {
        width: 100%;
        max-width: 260px;
        height: auto;
      }
      .side small {
        color: var(--muted);
        text-align: center;
      }

      .choices {
        display: grid;
        gap: 10px;
        margin: 6px 0 18px;
      }
      .choices.cols {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 6px;
      }
      legend {
        font-weight: 600;
        margin-bottom: 8px;
        padding: 0;
      }
      .opt {
        font: inherit;
        color: var(--ink);
        text-align: left;
        background: var(--surface);
        cursor: pointer;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        min-height: 48px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .opt:hover {
        border-color: var(--teal);
        background: #fafdfe;
      }
      .opt[aria-pressed="true"] {
        border-color: var(--teal-deep);
        background: var(--tint);
        font-weight: 600;
        box-shadow: inset 0 0 0 1px var(--teal-deep);
      }
      .opt.unsure {
        border-style: dashed;
      }
      .opt:disabled {
        cursor: default;
      }
      .opt:disabled:not([aria-pressed="true"]) {
        opacity: 0.55;
      }
      :focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 2px;
      }

      .btn {
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        padding: 13px 22px;
        min-height: 48px;
        background: #0b1e3c;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(11, 30, 60, 0.16);
        transition: background 0.15s;
      }
      .btn:hover:not(:disabled) {
        background: var(--teal-deep);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .link {
        font: inherit;
        background: none;
        border: 0;
        color: var(--teal-text);
        text-decoration: underline;
        cursor: pointer;
        padding: 6px 0;
      }

      .meter {
        height: 6px;
        background: var(--line);
        border-radius: 99px;
        overflow: hidden;
        margin: 0 0 20px;
      }
      .meter i {
        display: block;
        height: 100%;
        background: var(--teal);
        width: 0;
        transition: width 0.3s;
      }
      .where {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 6px;
      }
      .q {
        font-size: clamp(21px, 3vw, 26px);
        line-height: 1.22;
        letter-spacing: -0.015em;
        font-weight: 700;
        margin: 0 0 18px;
        max-width: 30ch;
      }
      .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      @media (max-width: 420px) {
        .answers {
          grid-template-columns: 1fr;
        }
      }

      .reveal {
        margin-top: 20px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        animation: rise 0.25s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal {
          animation: none;
        }
        .meter i {
          transition: none;
        }
      }
      .reveal dl {
        margin: 0 0 16px;
      }
      .reveal dt {
        font-weight: 700;
        margin-top: 12px;
      }
      .reveal dd {
        margin: 2px 0 0;
        max-width: 60ch;
        color: var(--ink);
      }
      .reveal dd.moment {
        color: var(--teal-text);
        font-weight: 500;
      }
      .win {
        font-weight: 700;
        color: var(--teal-text);
        margin: 0 0 6px;
      }

      .hold {
        background: var(--warn-bg);
        border: 1.5px solid var(--warn-line);
        color: var(--warn);
        border-radius: 12px;
        padding: 16px 18px;
        margin: 0 0 22px;
      }
      .hold h3 {
        color: var(--warn);
      }
      .hold ul {
        margin: 6px 0 0;
        padding-left: 20px;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 22px;
        margin: 6px 0 18px;
      }
      .stats b {
        font-size: 34px;
        letter-spacing: -0.02em;
        display: block;
        line-height: 1.1;
      }
      .stats span {
        color: var(--muted);
        font-size: 14px;
      }
      .moves {
        list-style: none;
        padding: 0;
        margin: 0 0 18px;
        display: grid;
        gap: 12px;
      }
      .moves li {
        border: 1px solid var(--line);
        border-left: 4px solid var(--teal);
        border-radius: 12px;
        padding: 16px 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .moves li.gate {
        border-left-color: var(--warn-line);
      }
      .moves .tag {
        font-size: 13px;
        color: var(--muted);
      }
      .moves p {
        margin: 4px 0 0;
        font-size: 15px;
      }
      details {
        margin: 0 0 18px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        padding: 6px 0;
      }
      details ul {
        margin: 6px 0 0;
        padding-left: 20px;
      }
      .fine {
        font-size: 13px;
        color: var(--muted);
        max-width: 70ch;
      }
      .results-grid {
        display: grid;
        gap: 28px;
        grid-template-columns: 1fr;
      }
      .results-grid .map {
        order: -1;
        max-width: 420px;
        margin: 0 auto;
        width: 100%;
      }
      @media (min-width: 860px) {
        .results-grid {
          grid-template-columns: minmax(0, 1fr) 380px;
          align-items: start;
        }
        .results-grid .map {
          order: 0;
          position: sticky;
          top: 20px;
          margin: 0;
        }
      }
      .map svg {
        width: 100%;
        height: auto;
      }

      .ask {
        border: 1.5px solid var(--teal);
        background: var(--tint);
        border-radius: 14px;
        padding: 22px;
        margin: 0 0 22px;
      }
      .ask h2 {
        font-size: 22px;
        margin-bottom: 6px;
      }
      .ask label.f {
        display: block;
        font-weight: 600;
        margin: 12px 0 4px;
      }
      .ask input[type="text"],
      .ask input[type="email"] {
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 11px 12px;
        min-height: 46px;
        width: 100%;
        max-width: 420px;
        display: block;
      }
      .ask input[type="text"]:focus-visible,
      .ask input[type="email"]:focus-visible {
        border-color: var(--teal);
      }
      .ask .chk {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin: 14px 0 16px;
        max-width: 52ch;
      }
      .ask .chk input {
        width: 20px;
        height: 20px;
        margin-top: 3px;
        flex: none;
        accent-color: var(--teal-deep);
      }
      .ask .err {
        color: var(--warn);
        font-size: 14px;
        min-height: 20px;
        margin: 6px 0 0;
      }
      .ask .done p {
        margin: 0 0 6px;
      }

      .itemtitle {
        font-size: clamp(22px, 3.2vw, 28px);
        line-height: 1.15;
        letter-spacing: -0.02em;
        font-weight: 700;
        margin: 0 0 6px;
        max-width: 28ch;
      }
      .explain {
        margin: 0 0 20px;
      }
      .explain dt {
        font-weight: 700;
        margin-top: 12px;
      }
      .explain dd {
        margin: 2px 0 0;
        max-width: 60ch;
      }
      .q2 {
        font-size: 19px;
        line-height: 1.3;
        font-weight: 700;
        margin: 0 0 12px;
        max-width: 40ch;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .askpro {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        color: var(--teal-text);
        background: var(--tint);
        border: 1px solid var(--tint-strong);
        border-radius: 99px;
        padding: 2px 10px;
        margin: 0 0 8px;
      }
      .draft {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        color: var(--warn);
        background: var(--warn-bg);
        border: 1px solid var(--warn-line);
        border-radius: 99px;
        padding: 2px 10px;
        margin: 0 0 8px;
      }
      .alert {
        background: var(--warn-bg);
        border-left: 4px solid var(--warn-line);
        color: var(--warn);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 0 0 16px;
        font-size: 15px;
        font-weight: 600;
        max-width: 62ch;
      }
      .src {
        font-size: 13px;
        color: var(--muted);
        max-width: 62ch;
      }
      .src a,
      .fine a {
        color: var(--teal-text);
      }
      .opt small {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 13px;
        margin-top: 2px;
      }
      .fq {
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }
      .fq:first-of-type {
        border-top: 0;
      }
      .fq p {
        margin: 0 0 8px;
        font-weight: 600;
        max-width: 60ch;
      }
      .fq .hint {
        font-weight: 400;
        color: var(--muted);
        font-size: 14px;
        margin-top: -4px;
      }
      .fq .yn {
        display: flex;
        gap: 10px;
      }
      .fq .yn .opt {
        min-width: 84px;
      }
      .catlabel {
        font-size: 13px;
        font-weight: 700;
        color: var(--teal-text);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 18px 0 0;
      }
      .note {
        background: var(--tint);
        border-left: 4px solid var(--teal);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 0 0 16px;
        font-size: 15px;
        max-width: 62ch;
      }
    </style>
  </head>

            "Pet treats are regulated by MDARD as animal feed, not cottage food. That path isn’t in the quest yet.",
          );
        if (has("othersvc"))
          out.push(
            "Beauty, body art, food service, and care services each have their own state licensing. Those paths are coming; until then, check with LARA or your local health department.",
          );
        return out;
      }

      /* Plain-language definitions (drafts to test with real people) */
      const WHAT = {
        entity:
          "A legal business entity, like an LLC, is a separate legal “person” you create by filing paperwork with the state.",
        dba: "An assumed name, or DBA for “doing business as,” is a registration that lets you operate under a name other than your legal name.",
        ein: "An EIN is your business’s federal tax ID number, a bit like a Social Security number for the business.",
        annual:
          "An annual filing is a yearly report you send the state to confirm your entity is still active and in good standing.",
        license:
          "A business license or permit is permission to operate, issued by your city, county, or a licensing board.",
        bank: "A business checking account is a bank account used only for business income and expenses, separate from your personal money.",
        pay: "A payment platform, like Stripe or Wave, lets customers pay you by card or bank transfer and keeps a record of every payment.",
        tax: "Quarterly estimated taxes are payments you send the IRS and the state four times a year, because no employer is withholding tax from your income.",
        bplan:
          "A business plan is a written explanation of who you serve, what you sell, how you make money, and where you’re headed.",
        pricing:
          "A pricing model is your written rule for what you charge and why, such as a simple rate card.",
        proj: "Financial projections are a spreadsheet forecast of the money you expect to bring in and spend over the next 12 months.",
        contract:
          "A written agreement spells out what each side will do, what gets paid, and what happens if something goes wrong.",
        review:
          "An attorney review means a licensed lawyer reads your contract and checks that it works under your state’s law.",
        change:
          "A change order process is a written way to handle requests that go beyond the original scope, with the extra price agreed before the work starts.",
        sub: "A subcontractor agreement is a contract with a freelancer or contractor you hire, covering what they do, how they’re paid, and who owns the work.",
        gl: "General liability insurance covers claims that your business injured someone or damaged their property.",
        eo: "Professional liability insurance, also called errors and omissions (E&amp;O), covers claims that your advice or work caused a client a financial loss.",
        tm: "A trademark search checks whether someone else already has legal rights to a name or logo similar to yours.",
        atty: "Having a business attorney identified means you already know which lawyer you would call, before a problem forces the choice.",
        det: "An IRS determination letter is the official letter confirming your organization is recognized as tax-exempt under 501(c)(3).",
        f990: "Form 990 is the yearly information return that tax-exempt organizations file with the IRS, and it’s public.",
        board:
          "A nonprofit board is the group of people legally responsible for governing the organization, with officers like a Chair, Secretary, and Treasurer.",
        pkg: "A grant readiness package is the set of core documents most funders ask for, kept current and in one place.",
        uei: "A Unique Entity ID (UEI) is the identifier the federal government assigns when you register in SAM.gov. It replaced the DUNS number for federal awards in April 2022.",
      };
      Object.values(LEVELS).forEach((l) =>
        l.items.forEach((it) => {
          it.what = it.what || WHAT[it.id];
        }),
      );
      const PTS = { done: 10, progress: 5, not: 0, unsure: 0 };
      const LABEL = {
        done: "In place",
        progress: "In progress",
        not: "Not yet",
        unsure: "Not sure",
        na: "Doesn’t apply",
      };

      const state = {
        cats: [],
        f: {},
        structure: null,
        situation: null,
        answers: {},
        idx: 0,
        queue: [],
        order: [],
        screen: "start",
      };
      const $ = (s) => document.querySelector(s);
      const app = $("#app");
      const reduce = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      function levelOrder() {
        return ["decide", "form", "money", "sell", "run"];
      }
      function buildQueue() {
        state.order = levelOrder();
        state.queue = state.order.flatMap((k) =>
          LEVELS[k].items
            .filter(
              (it) => !(it.skipFor && it.skipFor.includes(state.structure)),
            )
            .filter((it) => !it.when || it.when())
            .map((it) => ({ ...it, level: k })),
        );
        state.order = state.order.filter((k) =>
          state.queue.some((x) => x.level === k),
        );
      }
      function howText(it) {
        return state.structure === "sole" && it.howSole ? it.howSole : it.how;
      }
      function qText(it) {
        return it.q;
      }
      function titleText(it) {
        return it.title;
      }
      function whatText(it) {
        return it.what;
      }
      function maxXP() {
        return (
          10 * state.queue.filter((it) => state.answers[it.id] !== "na").length
        );
      }
      function xpTotal() {
        return Object.values(state.answers).reduce(
          (s, a) => s + (PTS[a] || 0),
          0,
        );
      }
      function levelFrac(k) {
        const ans = state.queue
          .filter((x) => x.level === k)
          .map((it) => state.answers[it.id])
          .filter((a) => a && a !== "na");
        if (!ans.length) return null;
        return ans.reduce((s, a) => s + PTS[a], 0) / (10 * ans.length);
      }
      function levelCounts(k) {
        const ans = state.queue
          .filter((x) => x.level === k)
          .map((it) => state.answers[it.id])
          .filter((a) => a && a !== "na");
        return {
          done: ans.filter((a) => a === "done").length,
          total: ans.length,
        };
      }
      function levelsForCompass() {
        return state.order.map((k) => ({
          key: k,
          short: LEVELS[k].short,
          frac: levelFrac(k),
          ...levelCounts(k),
        }));
      }
      function stageNote(k) {
        if (k === "form") {
          if (state.structure === "sole")
            return "You said you’re a sole proprietor, so this stage skips forming an entity. The trade-off: with no formal entity, your personal and business finances are legally the same thing. An LLC adds that separation, and you can form one later.";
          if (state.structure === "unsure")
            return "Not sure which structure fits? The usual options are sole proprietor (no legal protection), LLC (the most common for small businesses), and S-Corp or C-Corp (for investors or multiple owners). A business attorney and a CPA can help you choose.";
        }
        if (k === "run" && state.structure === "sole") return "";
        return "";
      }
      function setXP() {
        $("#xp").textContent =
          state.screen === "start" || state.screen === "follow"
            ? ""
            : xpTotal() + " of " + maxXP() + " XP";
      }

      /* ---------- Compass ---------- */
      function compassInner(levels, o) {
        const N = levels.length,
          cx = 180,
          cy = 180,
          rMax = 122,
          rMin = 18,
          grow = o.grow ?? 1;
        const pt = (a, r) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
        const f = (p) => p[0].toFixed(1) + "," + p[1].toFixed(1);
        let s = `<circle cx="${cx}" cy="${cy}" r="${rMax + 12}" fill="none" stroke="#7E93AB" stroke-width="2"/>`;
        levels.forEach((lv, i) => {
          const a = (2 * Math.PI * i) / N,
            th = Math.min(0.42, (Math.PI / N) * 0.62);
          const kite = (r) => {
            const sr = r * 0.34;
            return { tip: pt(a, r), l: pt(a - th, sr), r: pt(a + th, sr) };
          };
          const g = kite(rMax);
          s += `<polygon points="${f(g.tip)} ${f(g.r)} ${cx},${cy} ${f(g.l)}" fill="none" stroke="#7E93AB" stroke-width="1.6" stroke-dasharray="4 4"/>`;
          if (lv.frac != null) {
            const r = rMin + (rMax - rMin) * lv.frac * grow,
              k = kite(r);
            s += `<polygon points="${f(k.tip)} ${f(k.l)} ${cx},${cy}" fill="var(--teal)"/>`;
            s += `<polygon points="${f(k.tip)} ${f(k.r)} ${cx},${cy}" fill="var(--teal-deep)"/>`;
          }
          if (o.labels) {
            const lp = pt(a, rMax + 30),
              sn = Math.sin(a);
            const anchor = sn > 0.3 ? "start" : sn < -0.3 ? "end" : "middle";
            const sub = lv.total ? `${lv.done} of ${lv.total}` : "";
            s += `<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" text-anchor="${anchor}" fill="var(--ink)" font-size="13" font-weight="700" font-family="Inter,system-ui,sans-serif">${lv.short}<tspan x="${lp[0].toFixed(1)}" dy="15" font-weight="500" fill="var(--muted)" font-size="12">${sub}</tspan></text>`;
          }
        });
        return s;
      }
      function compassSVG(levels, o) {
        const vb = o.labels ? "-40 0 440 360" : "38 38 304 304";
        return `<svg viewBox="${vb}" role="img" aria-label="Readiness compass: each point grows as more foundations are in place">${compassInner(levels, o)}</svg>`;
      }

      /* ---------- Screens ---------- */
      function renderStart() {
        state.screen = "start";
        setXP();
        const s = state.situation,
          st = state.structure;
        const cur = { situation: s, structure: st };
        const opt = (group, val, label) =>
          `<button class="opt" data-g="${group}" data-v="${val}" aria-pressed="${cur[group] === val}">${label}</button>`;
        const cat = (c) =>
          `<button class="opt" data-c="${c.k}" aria-pressed="${has(c.k)}">${c.label}<small>${c.ex}</small></button>`;
        const ready = state.cats.length && s && st;
        app.innerHTML = `
  <div class="grid">
    <div>
      <h1>Find what your business is missing before someone asks for it.</h1>
      <p class="lead">Each step explains what the thing is and why you need it, then asks where you stand. You’ll get a map of your foundations and the three moves to make first. Built around Michigan requirements.</p>
      <div class="panel">
        <fieldset><legend>What do you sell? Pick all that apply.</legend>
          <div class="choices cols">${CATS.map(cat).join("")}</div></fieldset>

        <fieldset><legend>Where are you right now?</legend>
          <div class="choices cols">${opt("situation", "starting", "Just starting")}${opt("situation", "selling", "Already selling")}${opt("situation", "funding", "Going after funding")}</div></fieldset>
        <button class="btn" id="go" ${ready ? "" : "disabled"}>Next</button>
      </div>
    </div>
  </div>`;
        app.querySelectorAll("[data-g]").forEach((b) =>
          b.addEventListener("click", () => {
            state[b.dataset.g] = b.dataset.v;
            renderStart();
          }),
        );
        app.querySelectorAll("[data-c]").forEach((b) =>
          b.addEventListener("click", () => {
            const k = b.dataset.c;
            state.cats = has(k)
              ? state.cats.filter((x) => x !== k)

            renderStart();
            const again = app.querySelector(`[data-c="${k}"]`);
            if (again) again.focus();
          }),
        );
        const go = $("#go");
        if (go)
          go.addEventListener("click", () => {
            state.f = {};
            renderFollowups();
            window.scrollTo(0, 0);
          });
      }

      function followList() {
        const svc = has("trade") || has("pro") || has("othersvc");
        return FOLLOW.filter(
          (q) => (q.cat === "svc" ? svc : has(q.cat)) && (!q.show || q.show()),
        );
      }
      function renderFollowups(focusKey) {
        state.screen = "follow";
        setXP();
        const qs = followList();
        const names = {
          food: "Food & drinks",
          cos: "Body & beauty",
          goods: "Physical goods",
          trade: "Home & trade services",
          pro: "Professional & creative services",

        let last = "",
          html = "";
        qs.forEach((q) => {

            last = q.cat;
          }
          const v = state.f[q.k];
          html += `<div class="fq"><p>${q.q}</p>${q.hint ? `<p class="hint">${q.hint}</p>` : ""}
      <div class="yn"><button class="opt" data-k="${q.k}" data-v="1" aria-pressed="${v === true}">Yes</button><button class="opt" data-k="${q.k}" data-v="0" aria-pressed="${v === false}">No</button></div></div>`;
        });
        app.innerHTML = `
  <div class="grid">
    <div>
      <h2>A few questions about what you sell</h2>
      <p class="lead">Your answers decide which steps show up in your quest. Skip any you’re unsure of; a skipped question counts as no.</p>
      <div class="panel">
        ${qs.length ? html : "<p>No extra questions for what you picked.</p>"}
        <p style="margin-top:18px"><button class="btn" id="start">Start the quest</button> <button class="link" id="back">Back</button></p>
      </div>
    </div>
  </div>`;
        app.querySelectorAll("[data-k]").forEach((b) =>
          b.addEventListener("click", () => {
            const k = b.dataset.k;
            state.f[k] = b.dataset.v === "1";
            if (k === "kids" && !state.f.kids) {

              );
            }

            }
            renderFollowups(k);
          }),
        );
        if (focusKey) {

            `[data-k="${focusKey}"][aria-pressed="true"]`,

        }
        $("#back").addEventListener("click", () => {
          renderStart();
        });
        $("#start").addEventListener("click", () => {
          buildQueue();
          state.answers = {};
          state.idx = 0;
          renderQuestion();
          window.scrollTo(0, 0);
        });
      }

      function renderQuestion() {
        state.screen = "quest";
        setXP();
        const it = state.queue[state.idx],
          lv = LEVELS[it.level],
          ans = state.answers[it.id];
        const lvQs = state.queue.filter((x) => x.level === it.level),

        const btn = (v, label, cls = "") =>
          `<button class="opt ${cls}" data-a="${v}" aria-pressed="${ans === v}" ${ans ? "disabled" : ""}>${label}</button>`;
        let reveal = "";
        if (ans) {
          const last = state.idx === state.queue.length - 1;
          const nextLabel =
            lvQs[lvQs.length - 1] === it
              ? "Finish this level"
              : "Next question";
          if (ans === "done") {
            reveal = `<div class="reveal" aria-live="polite"><p class="win">+10 XP. This one’s in place.</p>
        <p>Keep the proof handy. People usually ask for it when this happens: ${it.moment.charAt(0).toLowerCase() + it.moment.slice(1)}</p>
        <button class="btn" id="next">${nextLabel}</button> <button class="link" id="change">Change answer</button></div>`;
          } else if (ans === "na") {
            reveal = `<div class="reveal" aria-live="polite"><p>Skipped. It won’t count for or against you.</p>
        <button class="btn" id="next">${nextLabel}</button> <button class="link" id="change">Change answer</button></div>`;
          } else {
            const pre =
              ans === "unsure"
                ? `<p class="win">Good to know where the blind spots are. Here’s what it takes.</p>`
                : ans === "progress"
                  ? `<p class="win">+5 XP. Here’s what finishing looks like.</p>`
                  : `<p class="win">Here’s what it takes.</p>`;
            reveal = `<div class="reveal" aria-live="polite">${pre}<dl>
        <dt>What it takes</dt><dd>${howText(it)}</dd>
        <dt>When it usually comes up</dt><dd class="moment">${it.moment}</dd></dl>
        ${srcHTML(it)}
        <button class="btn" id="next">${nextLabel}</button> <button class="link" id="change">Change answer</button></div>`;
          }
        }
        app.innerHTML = `
  <div class="grid quest">
    <div class="panel">
      <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${state.queue.length}" aria-valuenow="${state.idx + (ans ? 1 : 0)}"><i style="width:${(((state.idx + (ans ? 1 : 0)) / state.queue.length) * 100).toFixed(1)}%"></i></div>
      <div class="where">${lv.name}, question ${pos} of ${lvQs.length}</div>
      ${pos === 1 && stageNote(it.level) ? `<p class="note">${stageNote(it.level)}</p>` : ""}
      ${draftTag(it)}
      <h2 class="itemtitle">${titleText(it)}</h2>
      <dl class="explain"><dt>What it is</dt><dd>${whatText(it)}</dd><dt>Why you need it</dt><dd>${it.why}</dd></dl>
      ${alertHTML(it)}
      <p class="q2">${qText(it)}</p>
      <div class="answers">${btn("done", "In place")}${btn("progress", "In progress")}${btn("not", "Not yet")}${btn("unsure", "Not sure", "unsure")}</div>
      ${it.optional && !ans ? `<button class="link" data-a="na">Doesn’t apply to me</button>` : ""}
      ${reveal}
    </div>
    <aside class="side" aria-label="Your readiness compass">${compassSVG(levelsForCompass(), { labels: false })}<small>Your compass grows as you answer.</small></aside>
  </div>`;
        app.querySelectorAll("[data-a]").forEach((b) =>
          b.addEventListener("click", () => {
            state.answers[it.id] = b.dataset.a;
            renderQuestion();
            const n = $("#next");
            if (n) n.focus();
          }),
        );
        const n = $("#next");
        if (n)
          n.addEventListener("click", () => {
            const lastInLevel = lvQs[lvQs.length - 1] === it;
            if (lastInLevel) renderLevelDone(it.level);
            else {
              state.idx++;
              renderQuestion();
              window.scrollTo(0, 0);
            }
          });
        const c = $("#change");
        if (c)
          c.addEventListener("click", () => {
            delete state.answers[it.id];
            renderQuestion();
          });
      }

      function renderLevelDone(k) {
        state.screen = "level";
        setXP();
        const lv = LEVELS[k],
          c = levelCounts(k),
          i = state.order.indexOf(k),
          lastLevel = i === state.order.length - 1;
        const nextName = lastLevel ? "" : LEVELS[state.order[i + 1]].name;
        app.innerHTML = `
  <div class="grid quest">
    <div class="panel">
      <div class="where">Level complete</div>
      <h2>${lv.name}</h2>
      <p class="lead" style="font-size:20px">${c.total ? c.done + " of " + c.total + " in place." : "Skipped."}</p>
      <p>${c.total === 0 ? "Nothing to count here, so it won’t affect your map." : c.done === c.total ? "That level is covered." : c.total - c.done + " to go on this one. The map at the end will tell you what to do first."}</p>
      <button class="btn" id="cont">${lastLevel ? "See your map" : "Next level: " + nextName}</button>
    </div>
    <aside class="side" aria-label="Your readiness compass">${compassSVG(levelsForCompass(), { labels: false })}</aside>
  </div>`;
        window.scrollTo(0, 0);
        $("#cont").addEventListener("click", () => {
          if (lastLevel) renderResults();
          else {
            state.idx = state.queue.findIndex(
              (x) => x.level === state.order[i + 1],
            );
            renderQuestion();
          }
        });
      }

      function renderResults() {
        state.screen = "results";
        setXP();
        const all = state.queue
          .map((it) => ({ it, a: state.answers[it.id] }))
          .filter((x) => x.a && x.a !== "na");

        const gates =
          state.situation === "funding"
            ? all.filter((x) => x.it.gate && x.a !== "done")
            : [];
        const flagged = (x) => !!(x.it.alert && x.it.alert());
        const rank = (x) =>
          (gates.includes(x)
            ? 0
            : state.situation === "selling" && x.it.level === "sell"
              ? 1
              : 2) *
            10 +
          { unsure: 0, not: 1, progress: 2, done: 9 }[x.a];
        const byRank = (p, q) =>
          rank(p) - rank(q) ||
          state.queue.indexOf(p.it) - state.queue.indexOf(q.it);
        const todo = all.filter((x) => x.a !== "done").sort(byRank);
        /* Next moves: at most 2 items flagged by the person's own answers, then fill to 3 with the usual order.
     Remaining flagged items lead the "everything else" list. */
        const MAX_FLAGGED = 2;
        const flaggedTodo = todo.filter(flagged);
        const top = flaggedTodo.slice(0, MAX_FLAGGED);

        });
        todo.forEach((x) => {
          if (top.length < 3 && !top.includes(x)) top.push(x);
        });
        const leftover = todo.filter((x) => !top.includes(x));
        const rest = [
          ...leftover.filter(flagged),
          ...leftover.filter((x) => !flagged(x)),
        ];
        const levels = levelsForCompass();

        const hold = gates.length
          ? `<div class="hold"><h3>Hold before you apply</h3>
    <p style="margin:0">Funders commonly check these first. Fix them before you spend time on a proposal.</p>
    <ul>${gates.map((g) => `<li>${titleText(g.it)} (${LABEL[g.a].toLowerCase()})</li>`).join("")}</ul></div>`
          : "";
        const moveHTML = top
          .map(
            (x, n) => `<li class="${gates.includes(x) ? "gate" : ""}">
      <div class="tag">${LEVELS[x.it.level].name}, ${LABEL[x.a].toLowerCase()}${flagged(x) ? ", flagged by your answers" : gates.includes(x) ? ", funders check this first" : ""}</div>
      ${draftTag(x.it)}<h3>${titleText(x.it)}</h3>
      <p>${whatText(x.it)}</p>
      <p>${howText(x.it)}</p>
      <p style="color:var(--teal-text)">It usually comes up when: ${x.it.moment.charAt(0).toLowerCase() + x.it.moment.slice(1)}</p>${srcHTML(x.it)}</li>`,
          )
          .join("");
        const restHTML = rest.length
          ? `<details><summary>Everything else on your list (${rest.length})</summary><ul>${rest.map((x) => `<li>${titleText(x.it)} (${LABEL[x.a].toLowerCase()}${flagged(x) ? ", flagged by your answers" : ""})</li>`).join("")}</ul></details>`
          : "";

        app.innerHTML = `
  <div class="results-grid">
    <div>
      <h1 style="max-width:18ch">${done === all.length ? "Your foundations are in place." : "Here’s your foundation map."}</h1>
      ${hold}
      <div class="stats">
        <div><b>${done} of ${all.length}</b><span>foundations in place</span></div>
        <div><b>${unsure.length}</b><span>you weren’t sure about</span></div>
        <div><b>${xpTotal()} of ${maxXP()}</b><span>XP earned</span></div>
      </div>
      ${unsure.length ? `<p>The ones you weren’t sure about are the most likely to surprise you, so they come first below.</p>` : ""}
      ${top.length ? `<h2>Your next ${top.length === 1 ? "move" : top.length + " moves"}</h2><ol class="moves">${moveHTML}</ol>` : ""}
      ${restHTML}
      ${
        outOfScope().length
          ? `<div class="note"><h3>Not covered in this quest yet</h3><ul style="margin:6px 0 0;padding-left:20px">${outOfScope()
              .map((t) => `<li>${t}</li>`)
              .join("")}</ul></div>`
          : ""
      }
      <section class="ask" id="ask" aria-labelledby="askh">
        <h2 id="askh">Want a copy of your foundation map?</h2>
        <p>We’ll email you your map and your next moves, so you can work through them at your own pace.</p>
        <div id="askbody">
          <label class="f" for="fn">First name</label>
          <input type="text" id="fn" autocomplete="given-name">
          <label class="f" for="em">Email</label>
          <input type="email" id="em" autocomplete="email">
          <label class="chk"><input type="checkbox" id="talk"><span>I’d also like to talk through my gaps with a person.</span></label>
          <button class="btn" id="send">Email me my map</button>
          <p class="err" id="err" role="alert"></p>
          <p class="fine" style="margin:0">Prototype only: nothing you type here is sent or saved.</p>
        </div>
      </section>
      <p class="fine">This is a general guide, not legal, tax, or financial advice. Confirm the details for your situation with a licensed Michigan attorney, CPA, or insurance broker. Items tagged “Draft” haven’t been checked against an official source yet.</p>
      <button class="btn" id="again">Start over</button>
    </div>
    <div class="map"><svg id="cmp" viewBox="-40 0 440 360" role="img" aria-label="Readiness compass showing how complete each area is"></svg></div>
  </div>`;
        window.scrollTo(0, 0);
        const el = $("#cmp");
        if (reduce) {
          el.innerHTML = compassInner(levels, { labels: true, grow: 1 });
        } else {
          const t0 = performance.now();
          (function fr(now) {
            const t = Math.min(1, (now - t0) / 900),
              e = 1 - Math.pow(1 - t, 3);
            el.innerHTML = compassInner(levels, { labels: true, grow: e });
            if (t < 1) requestAnimationFrame(fr);
          })(t0);
        }
        $("#again").addEventListener("click", () => {
          state.cats = [];
          state.f = {};
          state.structure = null;
          state.situation = null;
          renderStart();
        });
        ["#fn", "#em"].forEach((s) =>
          $(s).addEventListener("input", () => {
            $("#err").textContent = "";
          }),
        );
        $("#send").addEventListener("click", () => {
          const fn = $("#fn").value.trim(),
            em = $("#em").value.trim(),
            talk = $("#talk").checked;
          if (!fn) {
            $("#err").textContent = "Add your first name.";
            $("#fn").focus();
            return;
          }
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) {
            $("#err").textContent =
              "Enter an email address like name@example.com.";
            $("#em").focus();
            return;
          }
          $("#askbody").innerHTML =
            `<div class="done" role="status"><p class="win">Thanks, ${fn.replace(/[<>&"]/g, "")}.</p>
      <p>In the real version, your map and next moves would arrive at that address${talk ? ", and someone would reach out to talk through your gaps" : ""}.</p>
      <p class="fine" style="margin:0">Prototype only: nothing was sent or saved.</p></div>`;
        });
      }

      /* Demo shortcut for recordings and live demos: add ?demo=start, ?demo=quest or ?demo=map to the link.
   Loads a sample home baker who also makes candles. The tool's logic runs as normal. */
      (function () {
        let mode = null;
        try {
          mode = new URLSearchParams(location.search).get("demo");
        } catch (e) {}
        if (!mode) {
          renderStart();
          return;
        }
        state.cats = ["food", "goods"];
        state.f = { candles: true };
        state.structure = "sole";
        state.situation = "selling";
        if (mode === "start") {
          renderStart();
          return;
        }
        buildQueue();
        state.answers = {};
        state.idx = 0;
        if (mode === "quest") {
          state.idx = Math.max(
            0,
            state.queue.findIndex((x) => x.id === "fpath"),
          );
          renderQuestion();
          return;
        }
        const done = [
            "bplan",
            "name",
            "pay",
            "pricing",
            "fzone",
            "flabel",
            "fvenue",
          ],
          unsure = ["fpath", "salestax", "pl", "frecords"];
        state.queue.forEach((it) => {
          state.answers[it.id] = done.includes(it.id)
            ? "done"
            : unsure.includes(it.id)
              ? "unsure"
              : "not";
        });
        renderResults();
      })();
    </script>
  </body>
</html>
